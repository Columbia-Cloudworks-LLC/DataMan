name: package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish win-x64 zip
        id: publish
        shell: pwsh
        run: |
          $zip = .\scripts\publish-win-x64.ps1
          "zip=$zip" >> $env:GITHUB_OUTPUT
      - name: Attach zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "${{ steps.publish.outputs.zip }}"
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $zip --title $tag --generate-notes
          } else {
            gh release upload $tag $zip --clobber
          }
