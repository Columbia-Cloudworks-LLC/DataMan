name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish win-x64 zip
        id: publish
        shell: pwsh
        run: |
          $zip = (.\scripts\publish-win-x64.ps1 | Select-Object -Last 1).Trim()
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "publish-win-x64.ps1 did not write a zip at '$zip'"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip=$zip"
      - name: Upload zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $zip = "${{ steps.publish.outputs.zip }}"
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "missing zip '$zip'"
          }
          gh release upload ${{ needs.release-please.outputs.tag_name }} $zip --clobber

  package-linux:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish linux-x64 tarball
        id: publish
        run: |
          tarball="$(./scripts/publish-linux-x64.sh | tail -n 1)"
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Upload tarball to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tarball="${{ steps.publish.outputs.tarball }}"
          test -f "$tarball"
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "$tarball" --clobber
